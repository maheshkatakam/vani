name: Build Vani APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VANI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo "VANI_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/vani-release.p12"
              echo "VANI_KEY_ALIAS=vani"
            } >> "$GITHUB_ENV"
            echo "Using the Vani release key."
          else
            echo "::warning::VANI_KEYSTORE_PASSWORD secret is missing, so this APK is signed with a temporary key and won't install over earlier versions."
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest

      - name: Build release APK
        env:
          VANI_KEYSTORE_PASSWORD: ${{ secrets.VANI_KEYSTORE_PASSWORD }}
          VANI_VERSION_CODE: ${{ github.run_number }}
          VANI_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Vani-1.0.${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Vani-1.0.${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && env.VANI_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --title "Vani 1.0.${{ github.run_number }}" \
            --notes "Open this page on your phone, download the APK below and open it to install or update Vani. Updating keeps your settings and API keys." \
            --latest
